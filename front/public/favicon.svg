<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Anime Tracker">
	<defs>
		<linearGradient id="ring" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#c084fc" />
			<stop offset="1" stop-color="#f472b6" />
		</linearGradient>
	</defs>
	<rect width="64" height="64" rx="14" fill="#171326" />
	<!-- Countdown ring, open at the top: the gap is the part of the season still unaired. -->
	<circle
		cx="32"
		cy="32"
		r="21"
		fill="none"
		stroke="url(#ring)"
		stroke-width="7"
		stroke-linecap="round"
		stroke-dasharray="99 33"
		transform="rotate(-70 32 32)"
	/>
	<!-- Success green is the product's "bingeable" signal, so the play mark carries it. -->
	<path d="M27 22.5 44 32 27 41.5Z" fill="#4ade80" />
</svg>
